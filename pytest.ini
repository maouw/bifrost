[pytest]
# Pytest configuration for bifrost

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Directories to search for tests
testpaths = tests

# Output options
addopts =
    # Verbose output
    # -v
    # Show local variables in tracebacks
    #-l
    # Show summary of all test outcomes
    #-ra
    # Strict markers (fail on unknown markers)
    # --strict-markers
    # Show warnings
    -W default
    # Use xdist for parallel test execution (if pytest-xdist is installed)
    # -n auto
    # Base temp directory for pytest
    #--basetemp=.pytest_temp
    # Coverage options (if pytest-cov is installed)
    # --cov=src/bifrost
    # --cov-report=term-missing
    # --cov-report=html

# Markers for categorizing tests
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests
    requires_gpu: marks tests that require GPU/CUDA
    requires_weights: marks tests that require trained model weights

# Logging
log_cli = true
log_cli_level = DEBUG
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Ignore certain warnings
filterwarnings =
    # Ignore TensorFlow deprecation warnings
    ignore::DeprecationWarning:tensorflow.*
    # Ignore ANTsPy warnings
    ignore::UserWarning:ants.*

# Minimum Python version
minversion = 3.11
