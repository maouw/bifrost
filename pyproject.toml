[project]
  name = "bifrost"
  version = "0.1.2-alpha"
  authors = [
    { name = "Andrew Berger", email = "a5b@stanford.edu" },
    { name = "Altan Orhon", email = "altan@uw.edu" }
  ]
  description = "Template building and cross-modal registration."
  readme = "README.md"
  license = { file = "LICENSE.md" }
  classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.12"
  ]
  requires-python = ">= 3.12,< 3.13"
  dependencies = [
    "antspyx>=0.6",
    "h5py>=3",
    "numpy>=1",
    "scikit-image>=0.22",
    "scikit-learn>=1",
    "scipy>=1.10",
    "snakemake>=9",
    "tenacity>=9",
    "tensorflow>=2.16",
    "tf-keras",
    "voxelmorph",
]

[project.urls]
  Homepage      = "https://github.com/ClandininLab/bifrost"
  "Source Code" = "https://github.com/maouw/bifrost"

[build-system]
  requires = [
    "uv_build>=0.8.6,<0.9.0"
  ]
  build-backend = "uv_build"

[project.scripts]
  bifrost = "bifrost.cli.bifrost:main"

# Ruff configuration: https://docs.astral.sh/ruff/configuration/#configuring-ruff
[tool.ruff]
  # Exclude a variety of commonly ignored directories.
  exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
    ".stubs",
    "typings"
  ]
  line-length = 160
  indent-width = 4
  target-version = "py312"

[tool.ruff.lint]
  select = [
    'F',  # Pyflakes
    'E',  # pycodestyle (Error)
    'I',  # isort
    'D',  # pydocstyle
    'UP', # pyupgrade,
    "B",  # flake8-bugbear,
    "Q",  # flake8-quotes,
    "PL"  # pylint
  ]
  ignore = [
    "PLR0913", # Too many arguments in function definition (7 > 5),
    "UP045"    # typing.Optional[...] is deprecated in favor of | syntax
  ]

  pydocstyle = { convention = "google" }

[tool.ruff.lint.per-file-ignores]
  'docs/*' = [ "D" ]
  'tests/*' = [
    "D"
  ]

[tool.ruff.lint.pylint]
  allow-magic-value-types = [
    "int",
    "str"
  ]

[tool.ruff.format]
  # Set line ending to "lf" (Unix)
  line-ending = "lf"
  # Set the indentation style to "space"
  indent-style = "space"
  # Enable auto-formatting of code examples in docstrings. Markdown, reStructuredText code/literal blocks and doctests are all supported.
  docstring-code-format = true

  # Set the line length limit used when formatting code snippets in docstrings.
  docstring-code-line-length = 180

[dependency-groups]
  dev = [
    "icecream",
    "ipython>=9",
    "mypy",
    "pre-commit>=4.3.0",
    "pytest>=8",
    "pytest-xdist[psutil]>=3.8.0",
    "ruff>=0.14.0",
    "snakefmt",
    "wat",
]
  metal = [
    "tensorflow-metal>=1.1 ; platform_machine=='arm64' and sys_platform=='darwin'",
    "tensorflow>=2.16,<=2.18; platform_machine=='arm64' and sys_platform=='darwin'"
  ]
  cuda = [
    "tensorflow[and-cuda]>=2.16; platform_machine=='x86_64' and sys_platform=='linux'"
  ]
  slurm = [
    "snakemake-executor-plugin-slurm"
  ]


[tool.uv]
  environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'"
  ]

[tool.uv.sources.voxelmorph]
  git = "https://github.com/voxelmorph/voxelmorph.git"
  rev = "53d1b95fa734648c92fd8af4f3807b09cb56c342"

[[tool.uv.dependency-metadata]]
  name = "voxelmorph"
  version = "0.2"
  requires-dist = [
    "pystrum@ git+https://github.com/adalca/pystrum.git@d83bd99ce25e3c79789f6891c174c39ec7f5209b",
    "neurite@ git+https://github.com/adalca/neurite.git@682f828b7b5fa652d7205c894c7fe667f1a26251"
  ]

[tool.mypy]
  python_version = 3.12
  strict = true
  mypy_path = ["typings"]

