[build-system]
requires = ["setuptools >= 61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bifrost"
version = "0.1.1-alpha"
authors = [
  { name = "Altan Orhon", email = "alta@uw.edu" },
  { name = "Andrew Berger", email = "a5b@stanford.edu" },
]
description = "Template building and cross-modal registration."
readme = "README.md"
license = {file = "LICENSE.md"}
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3.10",
]
requires-python = "== 3.10.*"
dependencies = [
  "antspyx~=0.4.2",
  "configargparse~=1.7.0",
  "numpy>=1.26.4,<2",
  "platformdirs~=4.3.6",
  "pulp==2.7.0",
  "requests~=2.32.4",
  "scikit-image~=0.24.0",
  "scikit-learn~=1.4.2",
  "scipy~=1.10.1",
  "snakemake~=7.32.4",
  "tensorflow~=2.15.1",
  "tf-keras~=2.15.1",
  "voxelmorph@git+https://github.com/ClandininLab/voxelmorph.git@ed92ff23455c8b8942a0c38ee8988223b71410c",
  # ALTERNATIVE URL: "voxelmorph@git+https://github.com/maouw/voxelmorph.git@ed92ff23455c8b8942a0c38ee8988223b71410c", 
  #"neurite@git+https://github.com/ClandininLab/neurite.git@40f054e3dd45a5bcc47999b549e2e60e05eaf4ce",
  # ALTERNATIVE URL: "neurite@git+https://github.com/ClandininLab/neurite.git@40f054e3dd45a5bcc47999b549e2e60e05eaf4ce"

]

[project.optional-dependencies]
dev = ["ipython", "mypy", "ruff"]

[project.urls]
Homepage = "https://github.com/ClandininLab/bifrost"
"Source Code" = "https://github.com/maouw/bifrost"

[tool.setuptools]
packages = ["bifrost", "bifrost.cli"]
zip-safe = true
include-package-data = true

[project.scripts]
bifrost = "bifrost.cli.bifrost:main"

[tool.mypy]
ignore_missing_imports = true
strict = true

# Ruff configuration: https://docs.astral.sh/ruff/configuration/#configuring-ruff
[tool.ruff]
# Exclude a variety of commonly ignored directories.
exclude = [
  ".bzr",
  ".direnv",
  ".eggs",
  ".git",
  ".git-rewrite",
  ".hg",
  ".ipynb_checkpoints",
  ".mypy_cache",
  ".nox",
  ".pants.d",
  ".pyenv",
  ".pytest_cache",
  ".pytype",
  ".ruff_cache",
  ".svn",
  ".tox",
  ".venv",
  ".vscode",
  "__pypackages__",
  "_build",
  "buck-out",
  "build",
  "dist",
  "node_modules",
  "site-packages",
  "venv",
]
line-length = 120
indent-width = 4
target-version = "py310"

[tool.ruff.lint]
select = [
  'F',  # Pyflakes
  'E',  # pycodestyle (Error)
  'I',  # isort
  'D',  # pydocstyle
  'UP', # pyupgrade
]
pydocstyle = { convention = "google" }

[tool.ruff.lint.per-file-ignores]
'docs/*' = ["D"]
'tests/*' = ["D"]


# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []


[tool.ruff.format]
# Set line ending to "lf" (Unix)
line-ending = "lf"

# Enable auto-formatting of code examples in docstrings. Markdown, reStructuredText code/literal blocks and doctests are all supported.
docstring-code-format = true

# Set the line length limit used when formatting code snippets in docstrings.
docstring-code-line-length = "dynamic"
