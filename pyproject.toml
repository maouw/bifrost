[project]
name = "bifrost"
version = "0.1.2-alpha"
authors = [
  { name = "Andrew Berger", email = "a5b@stanford.edu" },
  { name = "Altan Orhon", email = "altan@uw.edu" },
]
description = "Template building and cross-modal registration."
readme = "README.md"
license = {file = "LICENSE.md"}
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3.10",
]
requires-python = "== 3.10.*"
dependencies = [
  "antspyx~=0.4.2",
  "h5py~=3.12.0",
  "numpy>=1.26.4,<2",
  "scikit-image>=0.24.0,<0.26",
  "scikit-learn>=1.4.2,<2",
  "scipy>=1.10.1,<2",
  "tensorflow~=2.15.1",
  "tensorflow-metal>=1.2.0 ; sys_platform == 'darwin'",
  "tf-keras~=2.15.1",
  "voxelmorph",
]

[project.urls]
Homepage = "https://github.com/ClandininLab/bifrost"
"Source Code" = "https://github.com/maouw/bifrost"

[build-system]
requires = ["uv_build>=0.8.6,<0.9.0"]
build-backend = "uv_build"

[project.scripts]
bifrost = "bifrost.cli.bifrost:main"

# Ruff configuration: https://docs.astral.sh/ruff/configuration/#configuring-ruff
[tool.ruff]
# Exclude a variety of commonly ignored directories.
exclude = [
  ".bzr",
  ".direnv",
  ".eggs",
  ".git",
  ".git-rewrite",
  ".hg",
  ".ipynb_checkpoints",
  ".mypy_cache",
  ".nox",
  ".pants.d",
  ".pyenv",
  ".pytest_cache",
  ".pytype",
  ".ruff_cache",
  ".svn",
  ".tox",
  ".venv",
  ".vscode",
  "__pypackages__",
  "_build",
  "buck-out",
  "build",
  "dist",
  "node_modules",
  "site-packages",
  "venv",
  ".stubs",
  "typings"
]
line-length = 160
indent-width = 4
target-version = "py310"

[tool.ruff.lint]
select = [
  'F',  # Pyflakes
  'E',  # pycodestyle (Error)
  'I',  # isort
  'D',  # pydocstyle
  'UP', # pyupgrade,
  "B",   # flake8-bugbear,
  "Q", # flake8-quotes,
  "PL" # pylint
]
ignore = [
  "PLR0913", # Too many arguments in function definition (7 > 5)
]

pydocstyle = { convention = "google" }

[tool.ruff.lint.per-file-ignores]
'docs/*' = ["D"]
'tests/*' = ["D"]

[tool.ruff.lint.pylint]
allow-magic-value-types = ["int", "str"]

[tool.ruff.format]
# Set line ending to "lf" (Unix)
line-ending = "lf"
# Set the indentation style to "space"
indent-style = "space"
# Enable auto-formatting of code examples in docstrings. Markdown, reStructuredText code/literal blocks and doctests are all supported.
docstring-code-format = true

# Set the line length limit used when formatting code snippets in docstrings.
docstring-code-line-length = 180

[dependency-groups]
dev = [
    "ipython>=8.37.0",
    "scipy-stubs>=1.15.3.0",
    "pyright>=1.1.403",
    "types-tensorflow>=2.18.0.20250809",
]
snakemake = [
    "pulp~=2.7.0",
    "snakemake>=7.32.4,<8",
]
test = [
    "pytest>=8.4.1",
]
[tool.uv.sources]
voxelmorph = { git = "https://github.com/ClandininLab/voxelmorph.git", rev = "ed92ff23455c8b8942a0c38ee8988223b71410c5" }
